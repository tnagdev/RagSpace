openapi: 3.1.0
info:
  title: RagSpace Public API
  version: 1.0.0
  summary: The only API the browser talks to.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Served by `api-gateway` under `/api/v1`. The gateway authenticates the
    caller, enforces rate limits and translates each operation into gRPC calls
    to internal services (see `contracts/proto`). Internal services are never
    reachable from the browser.

    ## Conventions
    - **JSON.** Field names are `camelCase`. Timestamps are ISO-8601 UTC.
      Sizes are `…Bytes`, durations `…Seconds`. IDs are opaque strings.
    - **Nulls.** Responses always include every documented field, using
      `null` for absent values. Requests may omit optional fields.
    - **Strict input, tolerant output.** Request bodies with unknown fields
      are rejected (`400`). Clients must ignore unknown response fields and
      handle unknown enum values, so additive changes are not breaking.
    - **Versioning.** Additive changes ship within `v1`. Breaking changes ship
      as `/api/v2`.
    - **Enums.** Domain enum values are `UPPER_SNAKE_CASE`. Discriminators
      (`type`, `kind`) and event names are lower case.
    - **PATCH** bodies follow JSON Merge Patch semantics (RFC 7396): an omitted
      field is unchanged, `null` clears it.
    - **Creation.** `201 Created` with a `Location` header. Non-idempotent
      POSTs accept an `Idempotency-Key` header; retries with the same key
      within 24h return the original response.
    - **Auth and CSRF.** Session cookie `better-auth.session_token` (httpOnly,
      Secure, SameSite=Lax), set by the `/auth/*` endpoints. No tokens in JS
      storage. Unsafe methods (POST, PATCH, DELETE) must carry an `Origin`
      header matching the app origin, or they get `403`. The API is served
      same-origin with the app, so no CORS headers are sent.
    - **Pagination.** Cursor based: `?limit=` (1-100, default 20) and
      `?cursor=`. Responses are `{ items, nextCursor }`; `nextCursor` is
      `null` on the last page. Unpaginated lists are `{ items }`.
    - **Errors.** `application/problem+json` (RFC 9457) with a stable `code`.
      See `Problem`.
    - **Caching.** Authenticated responses are `Cache-Control: no-store`.
      Anonymous `GET /plans` is publicly cacheable for 5 minutes.
    - **Rate limits.** 100 req/min per user (per IP when anonymous); stricter
      per-operation limits are in each description. Every response carries
      `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`. A `429`
      adds `Retry-After`.
    - **Tracing.** Every response carries `X-Correlation-Id`; clients may send
      their own.
    - **Streaming.** Long-lived responses are Server-Sent Events. Each `data:`
      line is one JSON object whose `type` equals the SSE `event:` name.
servers:
  - url: /api/v1
    x-internal: false
security:
  - sessionCookie: []
tags:
  - name: System
    description: Liveness.
  - name: Auth
    description: |
      Session lifecycle. Implemented by auth-service (better-auth) behind an
      HTTP passthrough, because these flows set cookies and perform OAuth
      redirects.
  - name: Account
    description: The signed-in user's profile and account lifecycle.
  - name: Uploads
    description: |
      One upload flow for every size: create an upload, `PUT` each part
      straight to storage with the presigned URLs, then complete it. Small
      files get exactly one part. An upload is addressed by the id of the file
      it creates.
  - name: Files
    description: Uploaded and imported files, and their processing state.
  - name: Events
    description: Server-Sent Events stream of live updates.
  - name: Collections
    description: A user's folder tree of files.
  - name: Search
    description: Hybrid text and visual retrieval.
  - name: Conversations
    description: RAG chat over the user's files, with streamed replies.
  - name: Billing
    description: Plans, the subscription and quota usage.
  - name: Webhooks
    description: Payment provider callbacks.

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Gateway health
      security: []
      responses:
        '200':
          description: Gateway is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Create an account with email and password
      description: Signs the user in on success. Rate limit 5/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created and session started.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in with email and password
      description: Rate limit 10/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Session started.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: End the current session
      description: Idempotent; succeeds even without a session.
      security:
        - {}
        - sessionCookie: []
      responses:
        '204':
          description: Session revoked and cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /auth/oauth/{provider}:
    get:
      tags: [Auth]
      operationId: startOAuth
      summary: Start an OAuth sign-in
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: redirectTo
          in: query
          description: Same-origin path to land on after sign-in.
          schema:
            type: string
            pattern: '^/(?![/\\])'
            maxLength: 512
            default: /
      responses:
        '302':
          description: Redirect to the provider's consent screen.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /auth/oauth/{provider}/callback:
    get:
      tags: [Auth]
      operationId: completeOAuth
      summary: OAuth redirect target
      description: |
        Registered with the provider; not called by app code. On failure it
        redirects to `/auth/login?error=<code>` instead of returning an error.
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      responses:
        '302':
          description: Session started; redirect to `redirectTo`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Email a password reset link
      description: |
        Always `202`, whether or not the email exists, so it cannot be used to
        discover accounts. Rate limit 3/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed; all sessions revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change password while signed in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: The signed-in user
      description: Also the way to check whether a session is active.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Account]
      operationId: deleteMe
      summary: Delete the account and all its data
      description: |
        Requires a fresh session (signed in within the last 10 minutes);
        otherwise `403`. The account is removed immediately and the cookie
        cleared. Files, embeddings, scenes, conversations and the subscription
        are purged asynchronously.
      responses:
        '202':
          description: Accepted.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /uploads:
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: Start an upload
      description: Validates type and size and reserves storage quota.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Upload with presigned part URLs.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/QuotaExceeded'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /uploads/{fileId}/complete:
    post:
      tags: [Uploads]
      operationId: completeUpload
      summary: Finish an upload and start processing
      description: Idempotent; completing an already completed upload returns the file.
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '200':
          description: The file, now queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /uploads/{fileId}:
    delete:
      tags: [Uploads]
      operationId: abortUpload
      summary: Cancel an in-progress upload
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '204':
          description: Upload aborted, file removed, quota released.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: List the caller's files
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/FileType'
        - name: uploadStatus
          in: query
          schema:
            $ref: '#/components/schemas/UploadStatus'
        - name: processingStatus
          in: query
          schema:
            $ref: '#/components/schemas/ProcessingStatus'
        - name: processingStage
          in: query
          schema:
            $ref: '#/components/schemas/ProcessingStage'
        - name: collectionId
          in: query
          description: Only files directly in this collection.
          schema:
            $ref: '#/components/schemas/Id'
        - name: ids
          in: query
          description: Only these files.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: A page of files, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Files]
      operationId: importFile
      summary: Import a file from a URL
      description: Supports YouTube URLs. Consumes `YOUTUBE_VIDEOS` quota.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportFileRequest'
      responses:
        '201':
          description: The new file, queued for processing.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/QuotaExceeded'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [Files]
      operationId: getFile
      summary: Get a file
      description: Includes a short-lived `downloadUrl`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Files]
      operationId: updateFile
      summary: Rename a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFileRequest'
      responses:
        '200':
          description: Updated file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: Delete a file and everything derived from it
      responses:
        '204':
          description: Deleted. Derived data is purged asynchronously.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /files/{fileId}/reprocess:
    post:
      tags: [Files]
      operationId: reprocessFile
      summary: Run the processing pipeline again
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Live updates for the signed-in user
      description: |
        Server-Sent Events. On every (re)connect the first event is
        `files.snapshot` with all files still uploading or processing, so no
        replay is needed. A `: ping` comment is sent every 25s. Max 5
        concurrent streams per user.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/UserEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /collections:
    get:
      tags: [Collections]
      operationId: listCollections
      summary: List collections
      parameters:
        - name: parentId
          in: query
          description: |
            Omit for every collection (flat). `root` for top-level only. A
            collection id for its direct children.
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of collections, sorted by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Collections]
      operationId: createCollection
      summary: Create a collection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /collections/{collectionId}:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    get:
      tags: [Collections]
      operationId: getCollection
      summary: Get a collection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Collections]
      operationId: updateCollection
      summary: Rename, recolor or move a collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Collections]
      operationId: deleteCollection
      summary: Delete a collection and its sub-collections
      parameters:
        - name: deleteFiles
          in: query
          description: Also delete every file in the collection tree.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCollectionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /collections/{collectionId}/items:
    get:
      tags: [Collections]
      operationId: listCollectionItems
      summary: Browse a collection's contents
      description: Child collections first, then files.
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /collections/{collectionId}/files:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    post:
      tags: [Collections]
      operationId: addCollectionFiles
      summary: Add files to a collection
      description: Idempotent; files already in the collection are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCollectionFilesRequest'
      responses:
        '200':
          description: Updated collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Collections]
      operationId: removeCollectionFiles
      summary: Remove files from a collection
      description: Idempotent. The files themselves are not deleted.
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Updated collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /search:
    post:
      tags: [Search]
      operationId: search
      summary: Semantic search across the caller's files
      description: |
        Safe and idempotent. POST rather than GET keeps query text out of URLs
        and access logs. Rate limit 60/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Best matches first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List conversations
      parameters:
        - name: fileId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: collectionId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Most recently active first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Start a conversation
      description: |
        Consumes `FILE_CONVERSATIONS` quota when scoped to a file or
        collection, `CONVERSATIONS` otherwise. Send the first message with
        `POST /conversations/{conversationId}/messages`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/QuotaExceeded'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get a conversation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Delete a conversation
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: listMessages
      summary: Message history
      description: Newest first. Follow `nextCursor` to load older messages.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Conversations]
      operationId: sendMessage
      summary: Send a message and stream the reply
      description: |
        Server-Sent Events. The stream always ends with a `done` or `error`
        event. Errors detected before streaming starts are returned as
        `application/problem+json`. A retry with the same `Idempotency-Key`
        replays the stored reply instead of asking the model again. Rate limit
        20/min per user.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Reply stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatStreamEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /assistant/greeting:
    get:
      tags: [Conversations]
      operationId: getGreeting
      summary: Personalised greeting for the chat home screen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /plans:
    get:
      tags: [Billing]
      operationId: listPlans
      summary: Available plans
      description: |
        Public. When the caller is signed in, each plan carries `comparison`
        against the current plan.
      security:
        - {}
        - sessionCookie: []
      responses:
        '200':
          description: Active plans, cheapest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /subscription:
    get:
      tags: [Billing]
      operationId: getSubscription
      summary: The caller's subscription
      description: Every user has one; new accounts start on the free plan.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /subscription/change-plan:
    post:
      tags: [Billing]
      operationId: changePlan
      summary: Move to another plan
      description: |
        One entry point for checkout, upgrade and downgrade:
        - From free to paid: returns `checkoutUrl`; the plan changes once the
          provider confirms payment.
        - To a higher paid plan: upgrades immediately, prorated.
        - To a lower plan: scheduled for the end of the current period.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePlanRequest'
      responses:
        '200':
          description: Result of the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePlanResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /subscription/cancel:
    post:
      tags: [Billing]
      operationId: cancelSubscription
      summary: Cancel the paid subscription
      description: Idempotent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /subscription/pause:
    post:
      tags: [Billing]
      operationId: pauseSubscription
      summary: Pause billing
      description: Idempotent.
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /subscription/resume:
    post:
      tags: [Billing]
      operationId: resumeSubscription
      summary: Resume a paused subscription
      description: Idempotent.
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /subscription/scheduled-change:
    delete:
      tags: [Billing]
      operationId: cancelScheduledChange
      summary: Undo a pending downgrade or cancellation
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /usage:
    get:
      tags: [Billing]
      operationId: getUsage
      summary: Quota usage and storage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

  /webhooks/{provider}:
    post:
      tags: [Webhooks]
      operationId: receivePaymentWebhook
      summary: Payment provider callback
      description: |
        Server to server; exempt from the `Origin` check. The raw body and
        headers are forwarded to payment-service, which verifies the provider
        signature (`X-Signature` for Lemon Squeezy, `X-Razorpay-Signature` for
        Razorpay). Redeliveries of the same provider event are no-ops.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [lemon-squeezy, razorpay]
        - name: X-Signature
          in: header
          schema:
            type: string
            maxLength: 512
        - name: X-Razorpay-Signature
          in: header
          schema:
            type: string
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token

  headers:
    SetSessionCookie:
      description: Sets or clears the httpOnly session cookie.
      schema:
        type: string
    Location:
      description: URL of the created or target resource.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Seconds until the client may retry.
      schema:
        type: integer
        format: int32
        minimum: 0
    RateLimitLimit:
      description: Requests allowed in the current window.
      schema:
        type: integer
        format: int32
        minimum: 0
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
        format: int32
        minimum: 0
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
        format: int32
        minimum: 0

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque `nextCursor` from the previous page.
      schema:
        type: string
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated UUID; retries with the same key within 24h return the original response.
      schema:
        type: string
        format: uuid
        maxLength: 36
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google]

  responses:
    BadRequest:
      description: Invalid request (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.ragspace.app/errors/validation_failed
            title: Validation failed
            status: 400
            detail: One or more fields are invalid.
            code: validation_failed
            correlationId: 3f1c2a9e-8b7d-4c1e-9f0a-2b6d5e4c3a21
            errors:
              - field: name
                message: must not be empty
    Unauthorized:
      description: Missing or invalid session, or bad credentials (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        Request refused (`forbidden`): failed `Origin` check, or the operation
        needs a fresher session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not the caller's (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Current state does not allow the request (`conflict`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    QuotaExceeded:
      description: Plan limit reached (`quota_exceeded`); upgrade to continue.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.ragspace.app/errors/quota_exceeded
            title: Quota exceeded
            status: 402
            detail: Your plan allows 3 YouTube imports per month.
            code: quota_exceeded
            correlationId: 3f1c2a9e-8b7d-4c1e-9f0a-2b6d5e4c3a21
            metric: YOUTUBE_VIDEOS
            used: 3
            limit: 3
    TooManyRequests:
      description: Rate limited (`rate_limited`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerError:
      description: |
        Unexpected failure (`internal`), a dependency is down
        (`upstream_unavailable`, 503) or timed out (`upstream_timeout`, 504).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'

    Problem:
      type: object
      description: |
        RFC 9457 problem details plus a stable machine-readable `code`.
        Extension members (`errors`, `metric`, `used`, `limit`) appear only
        where noted.
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
        code:
          type: string
          enum:
            - validation_failed
            - unauthenticated
            - forbidden
            - not_found
            - conflict
            - quota_exceeded
            - rate_limited
            - upstream_unavailable
            - upstream_timeout
            - internal
        correlationId:
          type: string
        errors:
          description: Field-level details for `validation_failed`.
          type: array
          maxItems: 100
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        metric:
          $ref: '#/components/schemas/UsageMetric'
        used:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          format: int64
          minimum: 0

    Health:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        timestamp:
          type: string
          format: date-time

    Password:
      type: string
      minLength: 8
      maxLength: 128

    SignUpRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: '#/components/schemas/Password'

    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 128

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          maxLength: 512
        newPassword:
          $ref: '#/components/schemas/Password'

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          $ref: '#/components/schemas/Password'
        revokeOtherSessions:
          type: boolean
          default: true

    AuthResult:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, name, username, imageUrl, emailVerified, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        name:
          type: string
        username:
          type: [string, 'null']
        imageUrl:
          type: [string, 'null']
          format: uri
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        username:
          type: [string, 'null']
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]{3,30}$'

    FileType:
      type: string
      enum: [VIDEO, IMAGE, AUDIO, DOCUMENT, YOUTUBE_VIDEO, OTHER]
    UploadStatus:
      type: string
      enum: [PENDING, UPLOADING, COMPLETED, FAILED, CANCELLED]
    ProcessingStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, FAILED, SKIPPED]
    ProcessingStage:
      type: string
      description: Only advances, in this order.
      enum: [UPLOAD, EMBEDDING, SCENE_DETECTION, INDEXING, COMPLETED]
    UsageMetric:
      type: string
      enum:
        - CONVERSATIONS
        - STORAGE
        - FILE_CONVERSATIONS
        - YOUTUBE_VIDEOS
        - MAX_VIDEO_LENGTH
        - MAX_AUDIO_DURATION
    PlanType:
      type: string
      enum: [FREE, BASIC, PRO, ENTERPRISE]
    BillingInterval:
      type: string
      enum: [MONTHLY, YEARLY]
    SubscriptionStatus:
      type: string
      enum: [ACTIVE, TRIALING, PAST_DUE, PAUSED, CANCELLED, EXPIRED]

    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [fileName, sizeBytes, mimeType]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5497558138880
        mimeType:
          type: string
          maxLength: 255
          pattern: '^[\w.+-]+/[\w.+-]+$'

    Upload:
      type: object
      required: [file, partSizeBytes, parts, expiresAt]
      properties:
        file:
          $ref: '#/components/schemas/File'
        partSizeBytes:
          type: integer
          format: int64
          minimum: 1
        parts:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/UploadPartTarget'
        expiresAt:
          type: string
          format: date-time
          description: When the part URLs stop working.

    UploadPartTarget:
      type: object
      required: [partNumber, url]
      properties:
        partNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        url:
          type: string
          format: uri
          description: Presigned PUT URL. Read the `ETag` response header.

    CompleteUploadRequest:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/CompletedPart'

    CompletedPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag]
      properties:
        partNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        etag:
          type: string
          maxLength: 128

    ImportFileRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048

    UpdateFileRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    File:
      type: object
      required:
        - id
        - name
        - originalName
        - sizeBytes
        - mimeType
        - type
        - uploadStatus
        - processingStatus
        - processingStage
        - errorMessage
        - youtubeUrl
        - thumbnailUrl
        - downloadUrl
        - attributes
        - createdAt
        - updatedAt
        - uploadedAt
        - processingStartedAt
        - processingCompletedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: Display name; editable.
        originalName:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        mimeType:
          type: string
        type:
          $ref: '#/components/schemas/FileType'
        uploadStatus:
          $ref: '#/components/schemas/UploadStatus'
        processingStatus:
          $ref: '#/components/schemas/ProcessingStatus'
        processingStage:
          $ref: '#/components/schemas/ProcessingStage'
        errorMessage:
          type: [string, 'null']
        youtubeUrl:
          type: [string, 'null']
          format: uri
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: Short-lived presigned URL.
        downloadUrl:
          type: [string, 'null']
          format: uri
          description: Short-lived presigned URL. Only set by `GET /files/{fileId}`.
        attributes:
          type: object
          description: Technical attributes (duration, dimensions, ...).
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        uploadedAt:
          type: [string, 'null']
          format: date-time
        processingStartedAt:
          type: [string, 'null']
          format: date-time
        processingCompletedAt:
          type: [string, 'null']
          format: date-time

    FilePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/File'
        nextCursor:
          type: [string, 'null']

    FileState:
      type: object
      description: The live-updating subset of `File`.
      required: [id, name, uploadStatus, processingStatus, processingStage, progressPercent, errorMessage, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        uploadStatus:
          $ref: '#/components/schemas/UploadStatus'
        processingStatus:
          $ref: '#/components/schemas/ProcessingStatus'
        processingStage:
          $ref: '#/components/schemas/ProcessingStage'
        progressPercent:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 100
          description: Progress within the current stage, when the stage reports it.
        errorMessage:
          type: [string, 'null']
        updatedAt:
          type: string
          format: date-time

    UserEvent:
      description: One SSE `data:` payload on `GET /events`.
      oneOf:
        - $ref: '#/components/schemas/FilesSnapshotEvent'
        - $ref: '#/components/schemas/FileUpdatedEvent'
      discriminator:
        propertyName: type
        mapping:
          files.snapshot: '#/components/schemas/FilesSnapshotEvent'
          file.updated: '#/components/schemas/FileUpdatedEvent'

    FilesSnapshotEvent:
      type: object
      required: [type, files]
      properties:
        type:
          const: files.snapshot
        files:
          type: array
          description: Every file still uploading or processing.
          items:
            $ref: '#/components/schemas/FileState'

    FileUpdatedEvent:
      type: object
      required: [type, file]
      properties:
        type:
          const: file.updated
        file:
          $ref: '#/components/schemas/FileState'

    CollectionColor:
      type: string
      description: Palette token name, not a hex value.
      pattern: '^[a-z][a-z0-9-]{0,31}$'

    Collection:
      type: object
      required: [id, name, description, color, parentId, fileCount, childCount, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: [string, 'null']
        color:
          oneOf:
            - $ref: '#/components/schemas/CollectionColor'
            - type: 'null'
        parentId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        fileCount:
          type: integer
          format: int32
          minimum: 0
        childCount:
          type: integer
          format: int32
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCollectionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        color:
          $ref: '#/components/schemas/CollectionColor'
        parentId:
          $ref: '#/components/schemas/Id'

    UpdateCollectionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 500
        color:
          oneOf:
            - $ref: '#/components/schemas/CollectionColor'
            - type: 'null'
        parentId:
          description: '`null` moves the collection to the top level.'
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'

    AddCollectionFilesRequest:
      type: object
      additionalProperties: false
      required: [fileIds]
      properties:
        fileIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Id'

    DeleteCollectionResult:
      type: object
      required: [deletedCollections, deletedFiles]
      properties:
        deletedCollections:
          type: integer
          format: int32
          minimum: 0
        deletedFiles:
          type: integer
          format: int32
          minimum: 0

    CollectionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Collection'
        nextCursor:
          type: [string, 'null']

    CollectionItem:
      oneOf:
        - $ref: '#/components/schemas/CollectionItemCollection'
        - $ref: '#/components/schemas/CollectionItemFile'
      discriminator:
        propertyName: kind
        mapping:
          collection: '#/components/schemas/CollectionItemCollection'
          file: '#/components/schemas/CollectionItemFile'

    CollectionItemCollection:
      type: object
      required: [kind, collection]
      properties:
        kind:
          const: collection
        collection:
          $ref: '#/components/schemas/Collection'

    CollectionItemFile:
      type: object
      required: [kind, file, addedAt]
      properties:
        kind:
          const: file
        file:
          $ref: '#/components/schemas/File'
        addedAt:
          type: string
          format: date-time

    CollectionItemPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CollectionItem'
        nextCursor:
          type: [string, 'null']

    SearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      not:
        required: [fileIds, collectionId]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
        fileIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Id'
        collectionId:
          $ref: '#/components/schemas/Id'
        types:
          type: array
          uniqueItems: true
          maxItems: 6
          items:
            $ref: '#/components/schemas/FileType'
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 10

    SearchResults:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SearchHit'

    VisualDescription:
      type: object
      required: [summary, objects, setting, style, colors]
      properties:
        summary:
          type: [string, 'null']
        objects:
          type: array
          items:
            type: string
        setting:
          type: [string, 'null']
        style:
          type: [string, 'null']
        colors:
          type: array
          items:
            type: string

    SearchHit:
      type: object
      required:
        - fileId
        - fileName
        - fileType
        - sceneId
        - sceneNumber
        - score
        - startSeconds
        - endSeconds
        - snippet
        - thumbnailUrl
        - fileUrl
        - youtubeUrl
        - visual
      properties:
        fileId:
          $ref: '#/components/schemas/Id'
        fileName:
          type: string
        fileType:
          $ref: '#/components/schemas/FileType'
        sceneId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        sceneNumber:
          type: [integer, 'null']
          format: int32
          minimum: 1
        score:
          type: number
          minimum: 0
          maximum: 1
        startSeconds:
          type: [number, 'null']
        endSeconds:
          type: [number, 'null']
        snippet:
          type: [string, 'null']
          description: Matched transcript or text excerpt.
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        fileUrl:
          type: [string, 'null']
          format: uri
        youtubeUrl:
          type: [string, 'null']
          format: uri
        visual:
          oneOf:
            - $ref: '#/components/schemas/VisualDescription'
            - type: 'null'

    Conversation:
      type: object
      required: [id, title, fileId, collectionId, messageCount, lastMessagePreview, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: [string, 'null']
        fileId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        collectionId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        messageCount:
          type: integer
          format: int32
          minimum: 0
        lastMessagePreview:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateConversationRequest:
      type: object
      additionalProperties: false
      not:
        required: [fileId, collectionId]
      properties:
        fileId:
          $ref: '#/components/schemas/Id'
        collectionId:
          $ref: '#/components/schemas/Id'

    ConversationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Conversation'
        nextCursor:
          type: [string, 'null']

    Message:
      type: object
      required: [id, role, content, hits, fileIds, toolsUsed, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        role:
          type: string
          enum: [USER, ASSISTANT]
        content:
          type: string
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        fileIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        toolsUsed:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    MessagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          type: [string, 'null']

    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000
        fileIds:
          type: array
          minItems: 1
          maxItems: 100
          description: Narrow retrieval for this message only.
          items:
            $ref: '#/components/schemas/Id'

    Greeting:
      type: object
      required: [greeting]
      properties:
        greeting:
          type: string

    ChatStreamEvent:
      description: One SSE `data:` payload on `POST /conversations/{conversationId}/messages`.
      oneOf:
        - $ref: '#/components/schemas/ChatStepEvent'
        - $ref: '#/components/schemas/ChatToolEvent'
        - $ref: '#/components/schemas/ChatResultsEvent'
        - $ref: '#/components/schemas/ChatDeltaEvent'
        - $ref: '#/components/schemas/ChatDoneEvent'
        - $ref: '#/components/schemas/ChatErrorEvent'
      discriminator:
        propertyName: type
        mapping:
          step: '#/components/schemas/ChatStepEvent'
          tool: '#/components/schemas/ChatToolEvent'
          results: '#/components/schemas/ChatResultsEvent'
          delta: '#/components/schemas/ChatDeltaEvent'
          done: '#/components/schemas/ChatDoneEvent'
          error: '#/components/schemas/ChatErrorEvent'

    ChatStepEvent:
      type: object
      description: Progress of a named pipeline step.
      required: [type, step, label, status, error, errorCode]
      properties:
        type:
          const: step
        step:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [STARTED, DONE, FAILED]
        error:
          type: [string, 'null']
        errorCode:
          type: [string, 'null']

    ChatToolEvent:
      type: object
      required: [type, tool, status, arguments, resultCount]
      properties:
        type:
          const: tool
        tool:
          type: string
        status:
          type: string
          enum: [STARTED, DONE]
        arguments:
          type: [object, 'null']
          description: Set on STARTED.
        resultCount:
          type: [integer, 'null']
          format: int32
          minimum: 0
          description: Set on DONE.

    ChatResultsEvent:
      type: object
      required: [type, kind, hits]
      properties:
        type:
          const: results
        kind:
          type: string
          enum: [SEARCH, SCENE_THUMBNAILS]
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'

    ChatDeltaEvent:
      type: object
      description: Assistant text to append.
      required: [type, text]
      properties:
        type:
          const: delta
        text:
          type: string

    ChatDoneEvent:
      type: object
      required: [type, messageId, toolsUsed, resultCount]
      properties:
        type:
          const: done
        messageId:
          $ref: '#/components/schemas/Id'
        toolsUsed:
          type: array
          items:
            type: string
        resultCount:
          type: integer
          format: int32
          minimum: 0

    ChatErrorEvent:
      type: object
      required: [type, code, message]
      properties:
        type:
          const: error
        code:
          type: string
        message:
          type: string

    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          description: Minor units (cents, paise).
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code.

    Plan:
      type: object
      required: [id, name, description, type, interval, price, limits, features, comparison]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: [string, 'null']
        type:
          $ref: '#/components/schemas/PlanType'
        interval:
          $ref: '#/components/schemas/BillingInterval'
        price:
          $ref: '#/components/schemas/Money'
        limits:
          type: object
          description: Limit per metric; 0 means unlimited.
          propertyNames:
            $ref: '#/components/schemas/UsageMetric'
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        features:
          type: array
          items:
            type: string
        comparison:
          type: [string, 'null']
          enum: [CURRENT, UPGRADE, DOWNGRADE, null]
          description: Relative to the caller's plan; `null` when anonymous.

    PlanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'

    Subscription:
      type: object
      required:
        - id
        - plan
        - status
        - currentPeriodStart
        - currentPeriodEnd
        - cancelAtPeriodEnd
        - canceledAt
        - trialEndsAt
        - scheduledChange
        - nextPaymentAt
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        currentPeriodStart:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        canceledAt:
          type: [string, 'null']
          format: date-time
        trialEndsAt:
          type: [string, 'null']
          format: date-time
        scheduledChange:
          oneOf:
            - $ref: '#/components/schemas/ScheduledChange'
            - type: 'null'
        nextPaymentAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ScheduledChange:
      type: object
      required: [kind, planId, effectiveAt]
      properties:
        kind:
          type: string
          enum: [DOWNGRADE, CANCEL_TO_FREE]
        planId:
          $ref: '#/components/schemas/Id'
        effectiveAt:
          type: string
          format: date-time

    ChangePlanRequest:
      type: object
      additionalProperties: false
      required: [planId]
      properties:
        planId:
          $ref: '#/components/schemas/Id'

    ChangePlanResult:
      type: object
      required: [subscription, checkoutUrl]
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'
        checkoutUrl:
          type: [string, 'null']
          format: uri
          description: When set, redirect the user here to pay.

    CancelSubscriptionRequest:
      type: object
      additionalProperties: false
      properties:
        immediate:
          type: boolean
          default: false
          description: Cancel now instead of at period end.

    QuotaUsage:
      type: object
      required: [metric, used, limit, resetAt]
      properties:
        metric:
          $ref: '#/components/schemas/UsageMetric'
        used:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          format: int64
          minimum: 0
          description: 0 means unlimited.
        resetAt:
          type: [string, 'null']
          format: date-time

    StorageUsage:
      type: object
      required: [usedBytes, limitBytes, fileCount]
      properties:
        usedBytes:
          type: integer
          format: int64
          minimum: 0
        limitBytes:
          type: integer
          format: int64
          minimum: 0
          description: 0 means unlimited.
        fileCount:
          type: integer
          format: int32
          minimum: 0

    Usage:
      type: object
      required: [planType, quotas, storage]
      properties:
        planType:
          $ref: '#/components/schemas/PlanType'
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/QuotaUsage'
        storage:
          $ref: '#/components/schemas/StorageUsage'
