steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    dir: 'file-embedder'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/ragspace/file-embedder:${COMMIT_SHA}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/ragspace/file-embedder:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/${PROJECT_ID}/ragspace/file-embedder'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'file-embedder'
      - '--image=gcr.io/${PROJECT_ID}/ragspace/file-embedder:${COMMIT_SHA}'
      - '--region=asia-south1'
      - '--platform=managed'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/${PROJECT_ID}/ragspace/file-embedder:${COMMIT_SHA}'
  - 'gcr.io/${PROJECT_ID}/ragspace/file-embedder:latest'
