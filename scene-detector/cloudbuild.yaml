steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ragspace/scene-detector:$TAG_NAME'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ragspace/scene-detector:latest'
      - '.'

  # Step 2: Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/ragspace/scene-detector'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-cloud-run'
    args:
      - 'run'
      - 'deploy'
      - 'scene-detector'
      - '--image=gcr.io/$PROJECT_ID/ragspace/scene-detector:$TAG_NAME'
      - '--platform=managed'
      - '--region=asia-south1'
      - '--allow-unauthenticated'
      - '--set-env-vars=DATABASE_URL=postgresql://ragspace:$${DATABASE_PASSWORD}@localhost/ragspace?host=/cloudsql/$${CLOUD_SQL_CONNECTION},MODE=production,RABBITMQ_URL=$${RABBITMQ_URL},AWS_REGION=ap-south-1,AWS_S3_BUCKET=rag-user-uploads'
      - '--set-secrets=DATABASE_PASSWORD=DATABASE_PASSWORD:latest,RABBITMQ_URL=RABBITMQ_URL:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest'
      - '--add-cloudsql-instances=$${CLOUD_SQL_CONNECTION}'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300s'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--port=8080'
    secretEnv:
      - DATABASE_PASSWORD
      - RABBITMQ_URL
      - CLOUD_SQL_CONNECTION

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_PASSWORD/versions/latest
      env: 'DATABASE_PASSWORD'
    - versionName: projects/$PROJECT_ID/secrets/RABBITMQ_URL/versions/latest
      env: 'RABBITMQ_URL'
    - versionName: projects/$PROJECT_ID/secrets/CLOUD_SQL_CONNECTION/versions/latest
      env: 'CLOUD_SQL_CONNECTION'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - 'gcr.io/$PROJECT_ID/ragspace/scene-detector:$TAG_NAME'
  - 'gcr.io/$PROJECT_ID/ragspace/scene-detector:latest'
