steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    dir: 'scene-detector'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/ragspace/scene-detector:${COMMIT_SHA}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/ragspace/scene-detector:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/${PROJECT_ID}/ragspace/scene-detector'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'scene-detector'
      - '--image=gcr.io/${PROJECT_ID}/ragspace/scene-detector:${COMMIT_SHA}'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/${PROJECT_ID}/ragspace/scene-detector:${COMMIT_SHA}'
  - 'gcr.io/${PROJECT_ID}/ragspace/scene-detector:latest'
