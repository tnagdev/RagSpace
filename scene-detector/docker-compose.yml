version: "3.9"

services:
  scene-detector:
    image: scene-detector:latest
    container_name: scene-detector
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "80:8080"

    volumes:
      - temp-data:/tmp/scene-detector

    env_file:
      - .env

    environment:
      PYTHONPATH: /app
      TEMP_DIR: /tmp/scene-detector

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          'import urllib.request, os; urllib.request.urlopen(f''http://127.0.0.1:{os.getenv("PORT", "8080")}/health'').read()',
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  temp-data:
    name: scene-detector-temp-data
