steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    dir: 'api-gateway'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/ragspace/api-gateway:${COMMIT_SHA}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/ragspace/api-gateway:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/${PROJECT_ID}/ragspace/api-gateway'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/${PROJECT_ID}/ragspace/api-gateway:${COMMIT_SHA}'
  - 'gcr.io/${PROJECT_ID}/ragspace/api-gateway:latest'
