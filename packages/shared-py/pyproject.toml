[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragspace-shared"
version = "1.0.0"
description = "Shared Pydantic models, HTTP utilities, and payment client for RagSpace Python services."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ragspace_shared*"]
