[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragspace-shared"
version = "2.0.0"
description = "Generated protobuf contracts plus the gRPC, event bus and logging runtime shared by RagSpace Python services."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "grpcio>=1.84",
    "grpcio-health-checking>=1.84",
    "grpcio-reflection>=1.84",
    "protobuf>=6.30",
    "aio-pika>=9.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ragspace_shared*", "ragspace*"]
